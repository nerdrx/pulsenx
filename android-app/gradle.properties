android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
# connect-client 1.1.0 requires compileSdk 36, which is newer than the AGP on the
# classpath officially "knows" about. compileSdk does not change runtime behaviour, so
# silencing the advisory warning is preferable to chasing an AGP upgrade for it alone.
android.suppressUnsupportedCompileSdk=36
