apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.pulsenx.bridge'
    // 36, not 35: connect-client 1.1.0 ships AAR metadata demanding compileSdk >= 36 and
    // the build fails outright below it. minSdk/targetSdk are deliberately untouched —
    // compileSdk only decides which APIs are on the classpath, not runtime behaviour.
    compileSdk 36

    defaultConfig {
        applicationId "com.pulsenx.bridge"
        minSdk 26
        targetSdk 34
        // versionCode must only ever increase: devices already on code 2 would
        // reject the install otherwise. Android gates upgrades on versionCode,
        // not versionName, so walking the name back to match the suite version
        // (pc-app/package.json) is safe.
        versionCode 9
        versionName "1.2.1"
    }

    signingConfigs {
        release {
            if (keystoreProps.containsKey("storeFile")) {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
            // minSdk 26, so the v1 JAR signature buys nothing; v2 + v3 (key rotation) it is.
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProps.containsKey("storeFile")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // Health Connect is the sanctioned health-data exchange layer on Android:
    // Google Fit's third-party APIs are closed to new integrations, so everything
    // (Huawei Health included) is read from / written to Health Connect instead.
    // 1.1.0 stable is required on Android 14+: Health Connect moved into the platform
    // there (no com.google.android.apps.healthdata APK), and only the stable client's
    // no-provider-package overloads route availability checks to the platform module.
    implementation 'androidx.health.connect:connect-client:1.1.0'

    // The Health Connect client is coroutine-only; WorkManager drives the mirror sync.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
