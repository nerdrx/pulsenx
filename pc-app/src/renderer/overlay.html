<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
  <title>PulseNX Overlay</title>
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>
  <div class="overlay-card">
    <svg class="heart is-idle" id="overlay-heart" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>

    <div class="metrics">
      <div class="metric bpm" id="overlay-bpm-group">
        <span class="metric-val" id="overlay-bpm">--</span>
        <span class="metric-lbl">BPM</span>
      </div>
      <div class="metric stress" id="overlay-stress-group">
        <span class="metric-val" id="overlay-stress">--</span>
        <span class="metric-lbl">Stress</span>
      </div>
    </div>

    <div class="resize-handle" title="Drag to resize"></div>
  </div>

  <script type="module" src="js/overlay.js"></script>
</body>
</html>
